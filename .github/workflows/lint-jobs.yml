name: lint
on: push

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Lint
        run: npm run lint
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - run: cd server && npm run lint
